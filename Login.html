<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <h1>Login Page</h1>
    <form style=background-color:lightblue; padding:20px; width:20px; max-width:20px; min-width:auto;>
        <!-- <label for="username">Username</label> -->
         <label>Username</label>
        <input type="text" name="username" placeholder="Username"><br>
        <label for="password">Password</label>
        <input type="password" name="password" placeholder="Password" required><br>
        <label>Select date of birth<input type="date" name="dob"></label><br>
        <label> Gender><input type="radio" value="male" name="gender">MALE</label>
        <input type="radio" value="female" name="gender">Female<br>
        <label>Email address:<input type="email" placeholder=""abcd@gmail.com></label><br>
        <label>Upload resume<input type="file" name="resume"></label><br>
        <select name="country">
            <option value="India" selected>India</option>
            <option value="USA">USA</option>
        </select>
        <button type="submit">Login</button>

    </form>
</body>
</html>
